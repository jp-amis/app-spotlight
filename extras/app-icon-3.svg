  <!-- ===================================================================
       App icon — "spotlight buddy": a glowing cone-of-light character with a
       face and little legs, holding a magnifier. Brand indigo background.
       Edit in Inkscape, then: mise run make-icons
       =================================================================== -->
  <defs
     id="defs8">
