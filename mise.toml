[tools]
node = "22"
pnpm = "10"

[tasks.dev]
description = "Run the app in dev mode"
run = "pnpm tauri dev"

[tasks.build]
description = "Universal release build (applies .env.mas identifier/profile if present)"
run = "./scripts/build.sh"

[tasks.sandbox]
description = "Build + codesign (ad-hoc or $APPLE_DEV_IDENTITY) + run locally, sandboxed"
run = "./scripts/sandbox-run.sh"

[tasks.clean-data]
description = "Wipe local app data (sandbox container) for a fresh-install test"
run = "./scripts/clean-data.sh"

[tasks.release]
description = "Full MAS pipeline: build -> bump build# -> sign -> pkg (requires .env.mas)"
run = ["./scripts/build.sh", "./scripts/bump-build.sh", "./scripts/sign.sh", "./scripts/pkg.sh"]

[tasks.dist]
description = "Developer ID: build + sign + notarize a universal .dmg to send to testers (needs .env.dist)"
run = "./scripts/dist.sh"

[tasks.make-icons]
description = "Rasterize assets/*.svg into the app icon set + menu-bar template icon"
run = "./scripts/make-icons.sh"

[tasks.icon-preview]
description = "Open a montage of the shipped app icon at every macOS size (true pixel size)"
run = "./scripts/icon-preview.sh"

[tasks.mascots]
description = "Re-export extras/*.svg mascots into site/assets (hero + CTA)"
run = "./scripts/mascots.sh"

[tasks.iap-image]
description = "Rasterize assets/store/iap-favorites.svg into a 1024x1024 no-alpha PNG for the IAP store listing"
run = "rsvg-convert -w 1024 -h 1024 assets/store/iap-favorites.svg -o assets/store/iap-favorites.png"

[tasks.screenshots]
description = "Generate App Store marketing screenshots (mocks, or real captures in assets/store/captures/)"
run = "python3 ./scripts/gen-store-screenshots.py"

[tasks.icon]
description = "Generate .icns + png set from a 1024 png: mise run icon -- path/to/icon-1024.png"
run = "./scripts/build-icon.sh"

[tasks.sign]
description = "Codesign the built .app for MAS (needs APPLE_DIST_IDENTITY env)"
run = "./scripts/sign.sh"

[tasks.pkg]
description = "productbuild a signed .pkg for the Mac App Store (needs APPLE_INSTALLER_IDENTITY env)"
run = "./scripts/pkg.sh"

[tasks.fmt]
description = "Format Rust + frontend"
run = ["cargo fmt --manifest-path src-tauri/Cargo.toml", "pnpm prettier -w src"]

[tasks.test]
description = "Run Rust + frontend unit tests"
run = ["cargo test --manifest-path src-tauri/Cargo.toml", "pnpm test"]
