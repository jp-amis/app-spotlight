[package]
name = "spotlight"
version = "0.1.0"
description = "A fast, keyboard-first app launcher for macOS"
authors = ["jp"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "spotlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
base64 = "0.22"
notify = "6"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSData", "NSDictionary", "NSArray", "NSThread", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSGraphicsContext", "NSWindow", "NSResponder", "NSView", "NSScreen", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSPanel"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
